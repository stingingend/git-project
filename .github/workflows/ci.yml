name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "./backend[test,postgres]"
      - run: python -m pytest backend/tests -q
      - run: python scripts/benchmark_index.py --files 6 --changed 2 --repeat 1

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: codeatlas_test
          POSTGRES_USER: codeatlas
          POSTGRES_PASSWORD: ciOnlyPassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeatlas -d codeatlas_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://codeatlas:ciOnlyPassword@127.0.0.1:5432/codeatlas_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e "./backend[test,postgres]"
      - run: python -m pytest backend/tests/test_postgres.py -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify hosted workspace access boundary
        run: node ../scripts/smoke_hosted_web.mjs --stub-api

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: docker compose --env-file .env.docker.example config --quiet
      - run: docker compose --env-file .env.docker.example up --build --wait --wait-timeout 120
      - name: Verify unprivileged model cache writes
        run: docker compose --env-file .env.docker.example exec -T api python -c "import os,tempfile; from pathlib import Path; assert os.geteuid()!=0; f=tempfile.TemporaryFile(dir=Path.home()/'.cache'/'huggingface'); f.write(b'cache-check'); f.close()"
      - run: python scripts/smoke_stack.py
      - name: Restart with the same database volume
        run: |
          docker compose --env-file .env.docker.example down
          docker compose --env-file .env.docker.example up --wait --wait-timeout 120
          python scripts/smoke_stack.py --expect-existing
      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.docker.example logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose --env-file .env.docker.example down
